<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiDAR page seed — Buffalo (N42W079)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  button { font-size: 1rem; padding: .5rem 1rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: .75rem; border-radius: 6px; white-space: pre-wrap; }
  .ok { color: #0a7d28; } .err { color: #b00020; }
</style>
</head>
<body>
<h1>Seed LiDAR terrain page into Cache API</h1>
<p>This fetches the Buffalo LiDAR-derived <code>page_1200_42_79.s16</code> from this
origin and stores it in the same Cache API bucket + key the Site Planner's
<code>TerrainService</code> reads, so the app uses the LiDAR page for
N42&nbsp;W79 instead of SRTM. Other pages are untouched.</p>
<p><button id="seed">Seed cache</button> <button id="clear">Clear seeded entry</button></p>
<pre id="log">Idle.</pre>
<script>
const CACHE_NAME = 'meshtastic-terrain-v1';
const KEY = 'https://elevation-tiles-prod.s3.amazonaws.com/__processed/v1/page_1200_42_79.s16';
const SRC = new URL('page_1200_42_79.s16', location.href).href;
const EXPECTED = 1200 * 1200 * 2;
const log = (m, cls) => { const el = document.getElementById('log'); el.textContent += '\n' + m; if (cls) el.className = cls; };

document.getElementById('seed').onclick = async () => {
  const el = document.getElementById('log'); el.textContent = 'Seeding…'; el.className = '';
  try {
    const resp = await fetch(SRC);
    if (!resp.ok) throw new Error('fetch failed: HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    log(`downloaded ${buf.byteLength} bytes`);
    if (buf.byteLength !== EXPECTED) throw new Error(`size mismatch: ${buf.byteLength} != ${EXPECTED}`);
    const cache = await caches.open(CACHE_NAME);
    // fresh copy so the Response body isn't a detached buffer
    await cache.put(KEY, new Response(buf.slice(0), {
      headers: { 'Content-Type': 'application/octet-stream' },
    }));
    const hit = await cache.match(KEY);
    const check = hit ? (await hit.arrayBuffer()).byteLength : 0;
    if (check !== EXPECTED) throw new Error('verification read failed: ' + check);
    log(`SEEDED OK: ${KEY} (${check} bytes verified by re-read)`, 'ok');
    log('Reload/reopen the Site Planner to pick it up (in-memory memo is per-load).', 'ok');
  } catch (e) { log('ERROR: ' + e.message, 'err'); }
};

document.getElementById('clear').onclick = async () => {
  try {
    const cache = await caches.open(CACHE_NAME);
    const gone = await cache.delete(KEY);
    log(gone ? 'Cleared seeded entry.' : 'No entry found.', gone ? 'ok' : '');
  } catch (e) { log('ERROR: ' + e.message, 'err'); }
};
</script>
</body>
</html>
